upstream ukuri_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ukuri-research-auditor/public;
    index index.html;

    # Backend marker
    add_header X-Served-By $hostname always;

    # Basic hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Compression for text assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://ukuri_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        expires -1;
    }

    # HAProxy health check
    location = /healthz {
        proxy_pass http://ukuri_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---------- Static frontend ----------
    # Long-lived cache
    location ~* \.(?:svg|woff2?|mjs)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Short-lived cache
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    # 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/ukuri.access.log;
    error_log  /var/log/nginx/ukuri.error.log warn;
}
